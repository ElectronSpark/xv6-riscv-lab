export GIT_SSH_COMMAND='ssh -i $(realpath -s $(pwd)/../github-key)'
export LAB=fs

# Auto-detect TOOLPREFIX based on ARCH (default: riscv64).
# Only sets TOOLPREFIX if the toolchain is actually installed.
_xv6_root="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)"
_xv6_arch="${ARCH:-riscv64}"
[[ "$_xv6_arch" == "riscv" ]] && _xv6_arch="riscv64"
case "$_xv6_arch" in
    riscv64) _xv6_triplet="riscv64-xv6-linux-musl" ;;
    x86_64)  _xv6_triplet="x86_64-xv6-linux-musl" ;;
    *)       _xv6_triplet="" ;;
esac
if [[ -n "$_xv6_triplet" && -x "${_xv6_root}/toolchain/${_xv6_arch}/phase2/bin/${_xv6_triplet}-gcc" ]]; then
    export TOOLPREFIX="${_xv6_root}/toolchain/${_xv6_arch}/phase2/bin/${_xv6_triplet}-"
fi
unset _xv6_root _xv6_arch _xv6_triplet
