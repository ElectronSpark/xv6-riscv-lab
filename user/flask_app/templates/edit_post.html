{% extends "base.html" %}
{% block title %}{% if post %}Edit Post{% else %}New Post{% endif %} — xv6 Web Server{% endblock %}
{% block content %}
<h1>{% if post %}Edit Post{% else %}New Post{% endif %}</h1>
<form method="post">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" required
           value="{{ post.title if post else '' }}" maxlength="200">

    <label for="body">Content</label>
    <textarea id="body" name="body" rows="12" required>{{ post.body if post else '' }}</textarea>

    <button type="submit">{% if post %}Update{% else %}Publish{% endif %}</button>
</form>
<p><a href="{{ url_for('main.dashboard') }}">&larr; Back to dashboard</a></p>
{% endblock %}
