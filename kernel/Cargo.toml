[package]
name = "xv6_rust"
version = "0.1.0"
edition = "2021"
description = "Rust components linked into the xv6-riscv kernel"
publish = false
build = "build.rs"

[lib]
name = "xv6_rust"
crate-type = ["staticlib"]
path = "lib.rs"

[features]
# Wave 27 (kernel/start_kernel.rs) test-launch gates -- replace the C
# original's `#ifdef RWAD_WRITE_TEST` / `#ifdef SEMAPHORE_RUNTIME_TEST` /
# `#ifdef WORKQUEUE_RUNTIME_SMOKE_TEST` (previously wired via
# `target_compile_definitions` on the now-deleted start_kernel.c). Wired
# from `ENV{RWLOCK_TEST}` / `ENV{SEMAPHORE_TEST}` /
# `ENV{WORKQUEUE_RUNTIME_SMOKE_TEST}` at `cmake` configure time -- see
# `RUST_TEST_FEATURES` in kernel/CMakeLists.txt. Never enabled by default:
# a plain `cargo build` (or `cmake ..` without the env vars) builds the
# same normal-boot kernel as before this wave.
rwlock_test = []
semaphore_test = []
workqueue_smoke_test = []
# Phase 4 (docs/rustify/test_port_plan.md) in-kernel test suites, wired the
# same way as the three features above: `ENV{PCACHE_TEST}` /
# `ENV{WORKQUEUE_TEST}` at `cmake` configure time (see
# `RUST_TEST_FEATURES` in kernel/CMakeLists.txt) select these, gating the
# `pcache_launch_tests()` / `workqueue_test_launch_tests()` call sites in
# `kernel/start_kernel.rs`. Deliberately independent, additive gates —
# `workqueue_smoke_test` above is a separate, pre-existing (empty-stub)
# gate this task leaves untouched.
pcache_test = []
workqueue_test = []

[build-dependencies]
bindgen = "0.72"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
debug = false
overflow-checks = false
incremental = false

[profile.dev]
panic = "abort"
opt-level = "z"
debug = false
overflow-checks = false
incremental = false
